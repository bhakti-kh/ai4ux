[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = [
  "pip3 install -r requirements.txt",
  "cd 'Design Ai4UX Web App' && npm install"
]

[phases.build]
cmds = [
  "cd 'Design Ai4UX Web App' && npm run build && cp -r dist ../dist"
]

[start]
cmd = "gunicorn ai4ux:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
