  <line x1="16" y1="5"  x2="28" y2="27" stroke="#3A6FF7" stroke-width="2" stroke-linecap="round"/>
  <line x1="9"  y1="18" x2="23" y2="18" stroke="#3A6FF7" stroke-width="2" stroke-linecap="round"/>

