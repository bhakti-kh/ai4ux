<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Aetheris mark — dark</title>
  <desc>Aetheris Topology A symbol mark, dark variant</desc>

  <rect width="120" height="120" fill="#0D1117"/>

  <!-- Ghost extension edges -->
  <line x1="28" y1="98" x2="10"  y2="78" stroke="#3A6FF7" stroke-width="1.1" stroke-dasharray="3 4" stroke-linecap="round" opacity="0.32"/>
  <line x1="92" y1="98" x2="110" y2="78" stroke="#3A6FF7" stroke-width="1.1" stroke-dasharray="3 4" stroke-linecap="round" opacity="0.32"/>
  <line x1="60" y1="20" x2="60"  y2="6"  stroke="#3A6FF7" stroke-width="1.1" stroke-dasharray="3 4" stroke-linecap="round" opacity="0.32"/>

  <!-- Main A strokes -->
  <line x1="60" y1="20" x2="28" y2="98" stroke="#3A6FF7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="20" x2="92" y2="98" stroke="#3A6FF7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="64" x2="82" y2="64" stroke="#3A6FF7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ghost nodes -->
  <circle cx="10"  cy="78" r="3"   fill="#0D1117" stroke="#3A6FF7" stroke-width="1.2" opacity="0.28"/>
  <circle cx="110" cy="78" r="3"   fill="#0D1117" stroke="#3A6FF7" stroke-width="1.2" opacity="0.28"/>
  <circle cx="60"  cy="6"  r="2.5" fill="#0D1117" stroke="#3A6FF7" stroke-width="1"   opacity="0.28"/>

  <!-- Main nodes -->
  <circle cx="60" cy="20" r="6"   fill="#3A6FF7"/>
  <circle cx="28" cy="98" r="5"   fill="#0D1117" stroke="#3A6FF7" stroke-width="2"/>
  <circle cx="92" cy="98" r="5"   fill="#0D1117" stroke="#3A6FF7" stroke-width="2"/>

  <!-- Crossbar nodes -->
  <circle cx="38" cy="64" r="3.5" fill="#0D1117" stroke="#5DD6FF" stroke-width="1.6"/>
  <circle cx="82" cy="64" r="3.5" fill="#0D1117" stroke="#5DD6FF" stroke-width="1.6"/>
</svg>
